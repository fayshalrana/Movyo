apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: movyohealth-prod-ingress
  namespace: movyohealth-prod
  annotations:
    acme.cert-manager.io/http01-edit-in-place: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Gzip is enabled cluster-wide via k8s/ingress-nginx-gzip-configmap.yaml (server-snippet
    # gzip is ignored when allow-snippet-annotations is false on the ingress controller).
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - movyo.health
        - www.movyo.health
      secretName: movyohealth-prod-tls
  rules:
    - host: movyo.health
      http:
        paths:
          - path: /blog
            pathType: Prefix
            backend:
              service:
                name: blog-movyohealth-service
                port:
                  number: 80
          - path: /quiz
            pathType: Prefix
            backend:
              service:
                name: quiz-movyohealth-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: movyohealth-prod-service
                port:
                  number: 80
    - host: www.movyo.health
      http:
        paths:
          - path: /blog
            pathType: Prefix
            backend:
              service:
                name: blog-movyohealth-service
                port:
                  number: 80
          - path: /quiz
            pathType: Prefix
            backend:
              service:
                name: quiz-movyohealth-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: movyohealth-prod-service
                port:
                  number: 80