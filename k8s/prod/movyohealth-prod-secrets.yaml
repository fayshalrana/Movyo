apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: movyohealth-prod-vault-sync
  namespace: movyohealth-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-vault
  target:
    name: movyohealth-prod-secrets
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: secret/data/apps/prod/movyohealth-prod-secrets
