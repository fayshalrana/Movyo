---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: movyohealth-landing-dev-hpa
  namespace: movyohealth-landing-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: movyohealth-landing-dev
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
