<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movyo Health - Coming Soon</title>
<meta name="description" content="Movyo Health - Coming Soon">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#0f0f12;
overflow:hidden;
color:white;
font-family:'Inter', sans-serif;
}

/* Animated gradient glow background */

body::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:linear-gradient(60deg,#6a5cff,#00eaff,#ff2bd6,#00ffa3);
background-size:400% 400%;
animation:gradientMove 14s ease infinite;
filter:blur(140px);
opacity:.35;
}

@keyframes gradientMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* Main container */

.container{
text-align:center;
z-index:2;
animation:float 6s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0px)}
50%{transform:translateY(-12px)}
}

/* Title */

.title{
font-family:'Space Grotesk', sans-serif;
font-size:80px;
font-weight:700;
letter-spacing:8px;
background:linear-gradient(90deg,#ffffff,#00eaff,#ffffff);
background-size:200%;
-webkit-background-clip:text;
color:transparent;
animation:shine 6s linear infinite;
}

@keyframes shine{
0%{background-position:-200%}
100%{background-position:200%}
}

/* subtitle */

.subtitle{
margin-top:20px;
font-size:20px;
font-weight:300;
opacity:.85;
letter-spacing:1px;
}

/* divider */

.line{
margin:40px auto;
width:240px;
height:2px;
background:linear-gradient(90deg,transparent,#00eaff,transparent);
animation:pulse 2.5s infinite;
}

@keyframes pulse{
0%{opacity:.3}
50%{opacity:1}
100%{opacity:.3}
}

/* loading dots */

.loading{
display:flex;
justify-content:center;
gap:10px;
}

.loading span{
width:12px;
height:12px;
border-radius:50%;
background:#00eaff;
animation:dot 1.4s infinite;
}

.loading span:nth-child(2){animation-delay:.2s;}
.loading span:nth-child(3){animation-delay:.4s;}

@keyframes dot{
0%,80%,100%{transform:scale(.5);opacity:.4}
40%{transform:scale(1.2);opacity:1}
}

/* footer */

.footer{
position:absolute;
bottom:30px;
font-size:14px;
opacity:.6;
letter-spacing:1px;
}

</style>
</head>

<body>

<div class="container">

<div class="title">
COMING SOON
</div>

<div class="subtitle">
We’re building something beautiful. Stay tuned.
</div>

<div class="line"></div>

<div class="loading">
<span></span>
<span></span>
<span></span>
</div>

</div>

</body>
</html>
